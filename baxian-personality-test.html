    // ===== Quiz State =====
    var currentQ = 0;
    var scores = {};
    var immortalKeys = Object.keys(immortals);
    var lastSection = '';

    // ===== 音效引擎 (Web Audio API 合成，无需外部文件) =====
    var audioCtx = null;
    var soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { console.warn('[audio] Web Audio API 不支持，音效已禁用'); soundEnabled = false; }
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').style.display = soundEnabled ? '' : 'none';
      document.getElementById('soundOffIcon').style.display = soundEnabled ? 'none' : '';
      document.getElementById('soundToggle').classList.toggle('muted', !soundEnabled);
      console.log('[audio] 音效已' + (soundEnabled ? '开启' : '关闭'));
      if (soundEnabled) { getAudioCtx(); playClickSound(); }
    }

    // 通用：创建带滤波器的柔和音色
    function makeTone(ctx, freq, type, vol, attack, decay, filterFreq) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var filter = ctx.createBiquadFilter();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq || 2000, ctx.currentTime);
      filter.Q.setValueAtTime(1, ctx.currentTime);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + attack + decay);
      osc.connect(filter).connect(gain);
      return { osc: osc, gain: gain, stop: function(t) { osc.stop(t); } };
    }

    // 点击选项：木鱼敲击感（三角波+低通滤波，短促温暖）
    function playClickSound() {
      if (!soundEnabled) return;
      var ctx = getAudioCtx(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var now = ctx.currentTime;
      var t = makeTone(ctx, 660, 'triangle', 0.12, 0.002, 0.1, 1500);
      t.gain.connect(ctx.destination);
      t.osc.start(now); t.osc.stop(now + 0.1);
      console.log('[audio] click');
    }

    // 篇章切换：磬声余韵（双音叠加，温暖悠远）
    function playSectionSound() {
      if (!soundEnabled) return;
      var ctx = getAudioCtx(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var now = ctx.currentTime;
      // 基音
      var t1 = makeTone(ctx, 330, 'triangle', 0.1, 0.01, 1.2, 1200);
      t1.gain.connect(ctx.destination); t1.osc.start(now); t1.osc.stop(now + 1.2);
      // 五度泛音（更薄）
      var t2 = makeTone(ctx, 495, 'triangle', 0.04, 0.01, 0.8, 1500);
      t2.gain.connect(ctx.destination); t2.osc.start(now); t2.osc.stop(now + 0.8);
      console.log('[audio] section');
    }

    // 结果揭晓：古琴拨弦感（低频滑升+滤波，沉稳悠扬）
    function playResultSound() {
      if (!soundEnabled) return;
      var ctx = getAudioCtx(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var filter = ctx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(360, now + 0.6);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, now);
      filter.frequency.linearRampToValueAtTime(1500, now + 0.6);
      filter.Q.setValueAtTime(2, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.14, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 1.5);
      console.log('[audio] result');
    }

    function initScores() {
      scores = {};
      immortalKeys.forEach(function(k) { scores[k] = 0; });
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      getAudioCtx(); // 首次点击初始化音频上下文（浏览器需要用户交互后才能播放）
      initScores();
      currentQ = 0;
      lastSection = '';
      document.getElementById('qTotal').textContent = questions.length;
      showScreen('screen-quiz');
      renderQuestion();
    }

    function renderQuestion() {
      var q = questions[currentQ];
      document.getElementById('qNum').textContent = currentQ + 1;
      document.getElementById('progressFill').style.width =
        (currentQ / questions.length * 100) + '%';

      // Section banner
      var bannerEl = document.getElementById('sectionBanner');
      if (q.section && q.section.name !== lastSection) {
        lastSection = q.section.name;
        bannerEl.innerHTML =
          '<div class="section-banner">' +
          '<div class="section-banner-num">' + q.section.num + '</div>' +
          '<div class="section-banner-name">' + q.section.name + '</div>' +
          '</div>';
        bannerEl.style.display = 'block';
        playSectionSound();
      } else {
        bannerEl.style.display = 'none';
      }

      // Question text
      var qEl = document.getElementById('questionText');
      qEl.style.opacity = '0';
      qEl.style.transform = 'translateY(10px)';
      setTimeout(function() {
        qEl.textContent = q.q;
        qEl.style.opacity = '1';
        qEl.style.transform = 'translateY(0)';
        qEl.style.transition = 'all 0.4s ease';
      }, 100);

      // Options
      var list = document.getElementById('optionsList');
      list.innerHTML = '';
      var labels = ['A', 'B', 'C', 'D'];

      q.opts.forEach(function(opt, i) {
        var div = document.createElement('div');
        div.className = 'option';
        div.style.opacity = '0';
        div.style.transform = 'translateX(-10px)';
        div.innerHTML =
          '<div class="option-label">' + labels[i] + '</div>' +
          '<div class="option-text">' + opt.text + '</div>';
        div.addEventListener('click', function() { selectOption(opt); });
        list.appendChild(div);
        setTimeout(function() {
          div.style.opacity = '1';
          div.style.transform = 'translateX(0)';
          div.style.transition = 'all 0.3s ease';
        }, 150 + i * 70);
      });
    }

    function selectOption(opt) {
      playClickSound();
      console.log('[selectOption] 第' + (currentQ + 1) + '题选中: "' + opt.text + '"');
      console.log('[selectOption] 该选项加分给: ' + opt.s.join(', '));
      opt.s.forEach(function(key) {
        scores[key] += 1;
        console.log('  → ' + key + ' (' + immortals[key].name + ') 分数更新为: ' + scores[key]);
      });
      currentQ++;
      console.log('[selectOption] 当前进度: ' + currentQ + '/' + questions.length);
      console.log('[selectOption] 当前全部得分: ', JSON.parse(JSON.stringify(scores)));
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        document.getElementById('progressFill').style.width = '100%';
        console.log('[selectOption] ✓ 所有题目已完成，准备生成结果...');
        playResultSound();
        setTimeout(showResult, 400);
      }
    }

    function showResult() {
      console.log('========== [showResult] 开始生成结果 ==========');
      console.log('[showResult] 原始得分:', JSON.parse(JSON.stringify(scores)));

      // Find winner
      var winner = immortalKeys[0];
      var maxScore = -1;
      console.log('[showResult] 开始查找最高分得主...');
      immortalKeys.forEach(function(k) {
        var sc = scores[k];
        console.log('  候选 ' + k + ' (' + immortals[k].name + '): ' + sc + '分');
        if (sc > maxScore) { maxScore = sc; winner = k; }
      });
      var im = immortals[winner];
      console.log('[showResult] ★ 最高分得主: ' + winner + ' (' + im.name + ') 得分: ' + maxScore);

      // Sorted scores for breakdown
      var sorted = immortalKeys.slice().sort(function(a, b) { return scores[b] - scores[a]; });
      var second = immortals[sorted[1]];
      console.log('[showResult] 排名第二: ' + sorted[1] + ' (' + second.name + ') 得分: ' + scores[sorted[1]]);
      console.log('[showResult] 完整排名: ' + sorted.map(function(k, i) {
        return (i + 1) + '.' + immortals[k].name + '(' + scores[k] + '分)';
      }).join(' > '));

      // Score breakdown bars
      var maxPossible = questions.length;
      console.log('[showResult] 单仙理论最高分: ' + maxPossible + ' (共' + questions.length + '题，每题该仙+1分)');
      var breakdownHTML = sorted.map(function(k) {
        var pct = Math.round(scores[k] / maxPossible * 100);
        var im2 = immortals[k];
        console.log('  [缘分谱] ' + im2.name + ': ' + scores[k] + '/' + maxPossible + ' = ' + pct + '%');
        return '<div class="score-row">' +
          '<div class="score-name">' + im2.name + '</div>' +
          '<div class="score-bar-bg"><div class="score-bar-fill" style="background:' + im2.color + '" data-w="' + pct + '%"></div></div>' +
          '<div class="score-val">' + pct + '%</div>' +
          '</div>';
      }).join('');

      // Compat items
      console.log('[showResult] 最佳搭档列表: ' + im.compat.join(', '));
      var compatHTML = im.compat.map(function(name, i) {
        return '<div class="compat-item">' +
          '<span class="compat-icon" style="background:' + im.compatColors[i] + '"></span>' + name + '</div>';
      }).join('');

      // Tags
      var tagsHTML = im.tags.map(function(t) {
        return '<span class="result-tag">' + t + '</span>';
      }).join('');

      // Q版人物形象加载日志
      console.log('[showResult] ★ 加载Q版人物形象图片: ' + im.img);
      console.log('[showResult] 人物信息: { name: "' + im.name + '", title: "' + im.title + '", color: "' + im.color + '", tags: [' + im.tags.join(', ') + '] }');
      console.log('[showResult] 签语: "' + im.fortune + '"');

      var html =
        '<div class="result-badge">你 的 仙 缘 已 定</div>' +
        '<div class="result-name" style="color:' + im.color + '">' + im.name + '</div>' +
        '<div class="result-title">' + im.title + '</div>' +
        '<div class="result-image-wrap"><img src="' + im.img + '" alt="' + im.name + '" onload="console.log(\'[img] Q版图片加载成功: ' + im.img + '\')" onerror="console.error(\'[img] Q版图片加载失败: ' + im.img + '\')"></div>' +
        '<div class="result-tags">' + tagsHTML + '</div>' +
        '<div class="result-section">' +
          '<div class="result-section-title">仙 人 解 读</div>' +
          '<div class="result-section-text">' + im.desc + '</div>' +
        '</div>' +
        '<div class="result-section">' +
          '<div class="result-section-title">你 的 法 力</div>' +
          '<div class="result-section-text">' + im.strengths + '</div>' +
        '</div>' +
        '<div class="result-section">' +
          '<div class="result-section-title">修 行 之 路</div>' +
          '<div class="result-section-text">' + im.weaknesses + '</div>' +
        '</div>' +
        '<div class="result-fortune">「 ' + im.fortune + ' 」</div>' +
        '<div class="score-breakdown">' +
          '<div class="result-section-title" style="margin-bottom:0.8rem">八 仙 缘 分 谱</div>' +
          breakdownHTML +
        '</div>' +
        '<div style="text-align:center;font-size:0.85rem;color:var(--muted);margin-bottom:0.8rem;">' +
          '你的第二仙缘：<span style="color:' + second.color + '">' + second.name + '</span>' +
        '</div>' +
        '<div class="result-compat">' + compatHTML + '</div>' +
        '<div style="text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 0.5rem">最佳搭档</div>' +
        '<button class="btn-restart" onclick="startQuiz()">再 测 一 次</button>' +
        '<div class="share-hint">截图分享你的仙缘吧</div>';

      document.getElementById('resultContent').innerHTML = html;
      showScreen('screen-result');
      window.scrollTo(0, 0);
      console.log('[showResult] ✓ 结果页面已渲染完成');

      // Animate score bars
      setTimeout(function() {
        document.querySelectorAll('.score-bar-fill').forEach(function(bar) {
          bar.style.width = bar.getAttribute('data-w');
        });
        console.log('[showResult] ✓ 缘分百分比条形图动画已触发');
      }, 300);
      console.log('========== [showResult] 结果生成完毕 ==========');
    }
