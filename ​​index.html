<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 我们的甜蜜时光 | 情侣相册</title>
    <style>
        :root {
            --bg-primary: #1a0a0f;
            --bg-secondary: #1f1016;
            --bg-card: rgba(30, 14, 20, 0.85);
            --text-primary: #fce4ec;
            --text-secondary: #e8b4c4;
            --text-muted: #c4909e;
            --accent-pink: #ff6b9d;
            --accent-rose: #ff4079;
            --accent-coral: #ff7b89;
            --accent-gold: #f9c74f;
            --accent-soft: #ffb3c6;
            --glass-border: rgba(255, 150, 180, 0.2);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.45);
            --shadow-glow: 0 0 60px rgba(255, 107, 157, 0.2);
            --radius-sm: 14px;
            --radius-md: 22px;
            --radius-lg: 30px;
            --radius-xl: 40px;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
        }

        /* ============ 背景层 ============ */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-gradient-radial {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            animation: bgFloat 20s ease-in-out infinite;
        }
        .bg-gradient-radial.g1 {
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.45) 0%, transparent 70%);
            top: -20%;
            left: -12%;
            animation-delay: 0s;
        }
        .bg-gradient-radial.g2 {
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(255, 123, 137, 0.35) 0%, transparent 70%);
            top: 50%;
            right: -15%;
            animation-delay: -7s;
        }
        .bg-gradient-radial.g3 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(255, 179, 198, 0.28) 0%, transparent 70%);
            bottom: -20%;
            left: 28%;
            animation-delay: -13s;
        }
        .bg-gradient-radial.g4 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(249, 199, 79, 0.2) 0%, transparent 70%);
            top: 35%;
            left: 45%;
            animation-delay: -4s;
        }

        @keyframes bgFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -35px) scale(1.07);
            }
            50% {
                transform: translate(-30px, 25px) scale(0.95);
            }
            75% {
                transform: translate(20px, 45px) scale(1.04);
            }
        }

        /* 噪点纹理 */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* 飘落花瓣 */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.5;
            animation: fall linear infinite;
            pointer-events: none;
            user-select: none;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) translateX(0px);
                opacity: 0.6;
            }
            25% {
                transform: translateY(25vh) rotate(90deg) translateX(30px);
                opacity: 0.5;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(-20px);
                opacity: 0.35;
            }
            75% {
                transform: translateY(75vh) rotate(270deg) translateX(15px);
                opacity: 0.2;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-25px);
                opacity: 0;
            }
        }

        /* ============ 主容器 ============ */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============ 导航栏 ============ */
        .navbar {
            position: sticky;
            top: 14px;
            z-index: 100;
            margin: 14px auto 0;
            max-width: 1200px;
            padding: 0 24px;
        }
        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 24px;
            background: rgba(28, 14, 20, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
            transition: all 0.4s var(--transition-smooth);
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d, #ff4079);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 22px rgba(255, 107, 157, 0.4);
            transition: transform 0.3s var(--transition-smooth), box-shadow 0.3s;
        }
        .logo-icon:hover {
            transform: scale(1.1) rotate(-8deg);
            box-shadow: 0 6px 35px rgba(255, 107, 157, 0.6);
        }
        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fce4ec 0%, #ffb3c6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 9px 17px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.3s var(--transition-smooth);
            letter-spacing: 0.01em;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
            background: var(--glass-bg);
        }
        .nav-links a.active {
            background: rgba(255, 107, 157, 0.15);
            color: var(--accent-pink);
            font-weight: 600;
        }
        .nav-cta {
            padding: 10px 20px !important;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.25), rgba(255, 123, 137, 0.25)) !important;
            border: 1px solid rgba(255, 107, 157, 0.35) !important;
            color: var(--accent-pink) !important;
            font-weight: 600 !important;
            border-radius: 25px !important;
        }
        .nav-cta:hover {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.35), rgba(255, 123, 137, 0.35)) !important;
            box-shadow: 0 4px 22px rgba(255, 107, 157, 0.3);
            transform: translateY(-1px);
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text-primary);
            font-size: 1.5rem;
        }

        /* ============ Hero 区域 ============ */
        .hero-section {
            padding: 55px 0 35px;
            text-align: center;
            position: relative;
        }
        .hero-hearts {
            font-size: 2.5rem;
            animation: floatHearts 3s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 8px;
        }
        @keyframes floatHearts {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.1);
            }
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(255, 107, 157, 0.12);
            border: 1px solid rgba(255, 107, 157, 0.25);
            font-size: 0.85rem;
            color: var(--accent-pink);
            font-weight: 500;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s var(--transition-smooth) both;
        }
        .hero-badge .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-pink);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 107, 157, 0.7);
            }
            50% {
                opacity: 0.4;
                box-shadow: 0 0 0 14px rgba(255, 107, 157, 0);
            }
        }
        .hero-title {
            font-size: clamp(2.4rem, 5.5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s var(--transition-smooth) 0.1s both;
            background: linear-gradient(180deg, #ffffff 0%, #fce4ec 40%, #ffb3c6 80%, #ff6b9d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 580px;
            margin: 0 auto 32px;
            animation: fadeInUp 0.8s var(--transition-smooth) 0.2s both;
            letter-spacing: 0.02em;
        }
        .hero-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s var(--transition-smooth) 0.3s both;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.35s var(--transition-smooth);
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ff4079);
            color: #fff;
            box-shadow: 0 6px 32px rgba(255, 64, 121, 0.45);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 45px rgba(255, 64, 121, 0.6);
        }
        .btn-primary:active {
            transform: translateY(-1px) scale(0.97);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 150, 180, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ 上传区域 ============ */
        .upload-section {
            margin-bottom: 50px;
            animation: fadeInUp 0.7s var(--transition-smooth) 0.25s both;
        }
        .upload-area {
            background: var(--bg-card);
            border: 2px dashed rgba(255, 150, 180, 0.3);
            border-radius: var(--radius-lg);
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .upload-area:hover {
            border-color: rgba(255, 107, 157, 0.6);
            background: rgba(35, 16, 24, 0.85);
            box-shadow: var(--shadow-glow), 0 8px 50px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .upload-area.drag-over {
            border-color: var(--accent-pink) !important;
            background: rgba(255, 107, 157, 0.1) !important;
            box-shadow: 0 0 60px rgba(255, 107, 157, 0.35) !important;
            transform: scale(1.01);
        }
        .upload-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(255, 123, 137, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 2.2rem;
            transition: all 0.3s;
            border: 2px solid rgba(255, 150, 180, 0.3);
        }
        .upload-area:hover .upload-icon-wrap {
            transform: scale(1.08);
            border-color: rgba(255, 150, 180, 0.6);
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
        }
        .upload-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .upload-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        #fileInput {
            display: none;
        }
        .upload-hint {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ============ 照片网格 ============ */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 14px;
        }
        .section-title {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .section-title span {
            color: var(--accent-pink);
        }
        .photo-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 50px;
        }
        .photo-card {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            transition: all 0.4s var(--transition-smooth);
            animation: fadeInUp 0.5s var(--transition-smooth) both;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .photo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 150, 180, 0.5);
            box-shadow: 0 12px 45px rgba(255, 107, 157, 0.25), 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s var(--transition-smooth);
        }
        .photo-card:hover img {
            transform: scale(1.06);
        }
        .photo-card .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.35s var(--transition-smooth);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            pointer-events: none;
        }
        .photo-card:hover .photo-overlay {
            opacity: 1;
        }
        .photo-delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s var(--transition-smooth);
            pointer-events: auto;
            z-index: 5;
            backdrop-filter: blur(8px);
        }
        .photo-card:hover .photo-delete-btn {
            opacity: 1;
        }
        .photo-delete-btn:hover {
            background: rgba(255, 64, 121, 0.85);
            border-color: rgba(255, 150, 180, 0.8);
            transform: scale(1.1);
            box-shadow: 0 4px 18px rgba(255, 64, 121, 0.5);
        }
        .photo-date {
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            pointer-events: auto;
            z-index: 3;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            animation: fadeInUp 0.5s var(--transition-smooth) both;
        }
        .empty-state .empty-icon {
            font-size: 5rem;
            display: block;
            margin-bottom: 16px;
            animation: floatHearts 3s ease-in-out infinite;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        /* ============ 灯箱 ============ */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--transition-smooth);
            cursor: pointer;
            backdrop-filter: blur(15px);
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: var(--radius-md);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s var(--transition-smooth);
            cursor: default;
        }
        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }
        .lightbox-close:hover {
            background: rgba(255, 64, 121, 0.8);
            border-color: transparent;
            transform: scale(1.1);
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }
        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .lightbox-nav.prev {
            left: 20px;
        }
        .lightbox-nav.next {
            right: 20px;
        }

        /* ============ 页脚 ============ */
        .footer {
            border-top: 1px solid var(--glass-border);
            padding: 35px 0 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        .footer-hearts {
            font-size: 1.1rem;
            animation: floatHearts 2.5s ease-in-out infinite;
            display: inline-block;
        }
        .footer-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            color: var(--accent-pink);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28, 14, 20, 0.96);
            border: 1px solid rgba(255, 107, 157, 0.5);
            color: var(--accent-pink);
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.88rem;
            z-index: 9999;
            backdrop-filter: blur(20px);
            transition: transform 0.4s var(--transition-smooth);
            pointer-events: none;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.6);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .mobile-menu-btn {
                display: block;
            }
            .nav-links.mobile-open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 14px;
                right: 14px;
                background: rgba(28, 14, 20, 0.97);
                border: 1px solid var(--glass-border);
                border-radius: var(--radius-md);
                padding: 14px;
                gap: 3px;
                backdrop-filter: blur(20px);
                z-index: 200;
            }
            .nav-links.mobile-open a {
                padding: 11px 14px;
                border-radius: var(--radius-sm);
                display: block;
                text-align: center;
            }
            .hero-section {
                padding: 35px 0 25px;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            .upload-area {
                padding: 32px 18px;
            }
            .lightbox-nav {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .lightbox-nav.prev {
                left: 8px;
            }
            .lightbox-nav.next {
                right: 8px;
            }
            .footer {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .navbar-inner {
                padding: 10px 14px;
            }
            .logo-text {
                font-size: 1rem;
            }
            .hero-title {
                font-size: 1.8rem;
            }
            .btn {
                padding: 12px 20px;
                font-size: 0.82rem;
            }
            .main-container {
                padding: 0 10px;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <div class="bg-layer">
        <div class="bg-gradient-radial g1"></div>
        <div class="bg-gradient-radial g2"></div>
        <div class="bg-gradient-radial g3"></div>
        <div class="bg-gradient-radial g4"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- 飘落花瓣 -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="navbar-inner" id="navbarInner">
            <a href="#" class="logo-group">
                <div class="logo-icon">💕</div>
                <span class="logo-text">甜蜜时光</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#" class="active">首页</a></li>
                <li><a href="#upload">上传照片</a></li>
                <li><a href="#gallery">我们的相册</a></li>
                <li><a href="#" class="nav-cta">💌 爱你</a></li>
            </ul>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">☰</button>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">

        <!-- Hero区域 -->
        <section class="hero-section">
            <div class="hero-hearts">💖</div>
            <div class="hero-badge">
                <span class="dot"></span> 属于我们的甜蜜空间
            </div>
            <h1 class="hero-title">每一张照片<br>都是爱的印记</h1>
            <p class="hero-subtitle">
                记录我们在一起的每一个美好瞬间，把甜蜜永远珍藏在这里。上传你们的照片，一起打造独一无二的浪漫相册吧。
            </p>
            <div class="hero-actions">
                <button class="btn btn-primary" onclick="document.getElementById('upload').scrollIntoView({behavior:'smooth'})">
                    📸 上传照片
                </button>
                <a href="#gallery" class="btn btn-secondary">
                    浏览相册 →
                </a>
            </div>
        </section>

        <!-- 上传区域 -->
        <section class="upload-section" id="upload">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon-wrap">📷</div>
                <h3 class="upload-title">点击上传或拖拽照片到此处</h3>
                <p class="upload-subtitle">支持 JPG、PNG、WebP 格式，可一次选择多张</p>
                <p class="upload-hint">💡 每张照片最大 20MB，照片将保存在本地浏览器中</p>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
        </section>

        <!-- 照片画廊 -->
        <section id="gallery">
            <div class="section-header">
                <h2 class="section-title">📸 我们的<span>甜蜜相册</span></h2>
                <span class="photo-count" id="photoCount">共 0 张照片</span>
            </div>
            <div class="photo-grid" id="photoGrid">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 页脚 -->
        <div class="footer">
            <div>
                Made with <span class="footer-hearts">💕</span> for someone special
            </div>
            <div class="footer-links">
                <a href="#">关于我们</a>
                <a href="#">隐私说明</a>
                <a href="#">💌 告白墙</a>
            </div>
            <div>© 2024 甜蜜时光 · 爱永不过期</div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <button class="lightbox-nav prev" id="lightboxPrev">◀</button>
        <img src="" alt="放大照片" id="lightboxImg">
        <button class="lightbox-nav next" id="lightboxNext">▶</button>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ DOM元素 ============
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const photoGrid = document.getElementById('photoGrid');
            const photoCount = document.getElementById('photoCount');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const toast = document.getElementById('toast');
            const petalsContainer = document.getElementById('petalsContainer');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const navLinks = document.getElementById('navLinks');
            const navbarInner = document.getElementById('navbarInner');

            // ============ 状态 ============
            let photos = []; // 存储照片数据 { id, dataURL, date }
            let lightboxIndex = -1;

            // ============ 初始化 ============
            function init() {
                loadPhotosFromStorage();
                renderPhotoGrid();
                createPetals();
                bindEvents();
                updateNavScroll();
            }

            // ============ 本地存储 ============
            function loadPhotosFromStorage() {
                try {
                    const stored = localStorage.getItem('sweet_memories_photos');
                    if (stored) {
                        photos = JSON.parse(stored);
                    }
                } catch (e) {
                    photos = [];
                }
            }

            function savePhotosToStorage() {
                try {
                    // 限制存储的照片数量（最多50张），防止localStorage溢出
                    if (photos.length > 50) {
                        photos = photos.slice(-50);
                        showToast('⚠️ 相册已满，自动保留最近50张照片');
                    }
                    localStorage.setItem('sweet_memories_photos', JSON.stringify(photos));
                } catch (e) {
                    showToast('⚠️ 存储空间不足，请清理一些照片');
                    // 尝试删除最旧的照片
                    if (photos.length > 10) {
                        photos = photos.slice(-30);
                        try {
                            localStorage.setItem('sweet_memories_photos', JSON.stringify(photos));
                        } catch (e2) {
                            photos = photos.slice(-15);
                            localStorage.setItem('sweet_memories_photos', JSON.stringify(photos));
                        }
                    }
                }
            }

            // ============ 渲染照片网格 ============
            function renderPhotoGrid() {
                photoGrid.innerHTML = '';
                photoCount.textContent = `共 ${photos.length} 张照片`;

                if (photos.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    emptyDiv.innerHTML = `
                                <span class="empty-icon">💝</span>
                                <h3>还没有照片哦~</h3>
                                <p>快上传你们的甜蜜合照吧！</p>
                            `;
                    photoGrid.appendChild(emptyDiv);
                    return;
                }

                photos.forEach((photo, index) => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.style.animationDelay = `${index * 0.04}s`;
                    card.innerHTML = `
                                <img src="${photo.dataURL}" alt="甜蜜照片 ${index + 1}" loading="lazy">
                                <div class="photo-overlay">
                                    <span class="photo-date">${photo.date}</span>
                                </div>
                                <button class="photo-delete-btn" data-index="${index}" title="删除照片">🗑️</button>
                            `;

                    // 点击卡片查看大图
                    card.addEventListener('click', (e) => {
                        // 如果点击的是删除按钮，不触发查看
                        if (e.target.classList.contains('photo-delete-btn')) return;
                        openLightbox(index);
                    });

                    // 删除按钮
                    const deleteBtn = card.querySelector('.photo-delete-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deletePhoto(index);
                    });

                    photoGrid.appendChild(card);
                });
            }

            // ============ 删除照片 ============
            function deletePhoto(index) {
                if (confirm('确定要删除这张照片吗？删除后无法恢复哦~ 💔')) {
                    photos.splice(index, 1);
                    savePhotosToStorage();
                    renderPhotoGrid();
                    showToast('照片已删除');
                }
            }

            // ============ 灯箱功能 ============
            function openLightbox(index) {
                if (index < 0 || index >= photos.length) return;
                lightboxIndex = index;
                lightboxImg.src = photos[lightboxIndex].dataURL;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lightboxIndex = -1;
            }

            function navigateLightbox(direction) {
                if (photos.length === 0) return;
                lightboxIndex += direction;
                if (lightboxIndex < 0) lightboxIndex = photos.length - 1;
                if (lightboxIndex >= photos.length) lightboxIndex = 0;
                lightboxImg.src = photos[lightboxIndex].dataURL;
            }

            // ============ 照片上传 ============
            function handleFiles(files) {
                if (!files || files.length === 0) return;

                const validFiles = [];
                const maxSize = 20 * 1024 * 1024; // 20MB
                let skippedCount = 0;
                let sizeSkippedCount = 0;

                for (const file of files) {
                    if (!file.type.startsWith('image/')) {
                        skippedCount++;
                        continue;
                    }
                    if (file.size > maxSize) {
                        sizeSkippedCount++;
                        continue;
                    }
                    validFiles.push(file);
                }

                if (validFiles.length === 0) {
                    let msg = '请选择图片文件（JPG、PNG、WebP格式）';
                    if (sizeSkippedCount > 0) msg = '部分照片超过20MB限制，请压缩后重试';
                    showToast('⚠️ ' + msg);
                    return;
                }

                let loadedCount = 0;
                const totalCount = validFiles.length;

                validFiles.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const dataURL = e.target.result;
                        const now = new Date();
                        const dateStr =
                            `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                        photos.push({
                            id: Date.now() + Math.random().toString(36).substr(2, 9),
                            dataURL: dataURL,
                            date: dateStr
                        });

                        loadedCount++;
                        if (loadedCount === totalCount) {
                            savePhotosToStorage();
                            renderPhotoGrid();
                            const msg = totalCount === 1 ?
                                '照片上传成功！💕' :
                                `${totalCount} 张照片上传成功！💕`;
                            showToast(msg);
                            // 滚动到相册区域
                            document.getElementById('gallery').scrollIntoView({ behavior: 'smooth',
                                block: 'start' });
                        }
                    };
                    reader.onerror = function() {
                        loadedCount++;
                        if (loadedCount === totalCount && photos.length > 0) {
                            savePhotosToStorage();
                            renderPhotoGrid();
                            showToast('部分照片上传成功');
                        }
                    };
                    reader.readAsDataURL(file);
                });

                if (skippedCount > 0 || sizeSkippedCount > 0) {
                    let hint = '';
                    if (skippedCount > 0) hint += `${skippedCount} 个非图片文件已跳过`;
                    if (sizeSkippedCount > 0) hint +=
                        `${hint ? '，' : ''}${sizeSkippedCount} 个文件超过20MB已跳过`;
                    showToast('⚠️ ' + hint);
                }

                if (validFiles.length > 0 && loadedCount === 0) {
                    showToast('正在处理照片...');
                }
            }

            // ============ Toast ============
            let toastTimer;

            function showToast(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }

            // ============ 飘落花瓣 ============
            function createPetals() {
                const petalEmojis = ['🌸', '💮', '🌷', '🩷', '💗', '🌺', '✿', '❀', '🩵', '💐'];
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < 35; i++) {
                    const petal = document.createElement('span');
                    petal.className = 'petal';
                    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                    petal.style.left = Math.random() * 100 + '%';
                    petal.style.fontSize = (Math.random() * 1.4 + 0.8) + 'rem';
                    petal.style.animationDuration = (Math.random() * 12 + 8) + 's';
                    petal.style.animationDelay = (Math.random() * 15) + 's';
                    petal.style.opacity = (Math.random() * 0.35 + 0.15);
                    fragment.appendChild(petal);
                }

                petalsContainer.appendChild(fragment);
            }

            // ============ 事件绑定 ============
            function bindEvents() {
                // 点击上传区域
                uploadArea.addEventListener('click', (e) => {
                    fileInput.click();
                });

                // 文件选择
                fileInput.addEventListener('change', (e) => {
                    handleFiles(e.target.files);
                    fileInput.value = ''; // 重置以允许重新选择相同文件
                });

                // 拖拽上传
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    uploadArea.classList.add('drag-over');
                });

                uploadArea.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    uploadArea.classList.remove('drag-over');
                });

                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    uploadArea.classList.remove('drag-over');
                    const files = e.dataTransfer.files;
                    handleFiles(files);
                });

                // 全局拖拽（防止浏览器打开文件）
                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                });

                // 灯箱关闭
                lightboxClose.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeLightbox();
                });
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) {
                        closeLightbox();
                    }
                });

                // 灯箱导航
                lightboxPrev.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigateLightbox(-1);
                });
                lightboxNext.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigateLightbox(1);
                });

                // 键盘导航
                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('active')) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                });

                // 移动端菜单
                mobileMenuBtn.addEventListener('click', () => {
                    navLinks.classList.toggle('mobile-open');
                });

                // 点击导航链接关闭移动菜单
                navLinks.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        navLinks.classList.remove('mobile-open');
                    });
                });

                // 导航栏滚动效果
                window.addEventListener('scroll', updateNavScroll);

                // 粘贴上传
                document.addEventListener('paste', (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    const imageFiles = [];
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const file = item.getAsFile();
                            if (file) imageFiles.push(file);
                        }
                    }
                    if (imageFiles.length > 0) {
                        e.preventDefault();
                        handleFiles(imageFiles);
                    }
                });
            }

            function updateNavScroll() {
                if (window.scrollY > 60) {
                    navbarInner.classList.add('scrolled');
                } else {
                    navbarInner.classList.remove('scrolled');
                }
            }

            // ============ 启动 ============
            init();

            console.log('💕 甜蜜时光相册已就绪！');
            console.log('📸 支持：点击上传 | 拖拽上传 | 粘贴上传（Ctrl+V）');
            console.log('💾 照片保存在浏览器本地存储中');
            console.log('🗑️ 悬停照片可删除，点击照片可放大查看');
        })();
    </script>
</body>
</html>
