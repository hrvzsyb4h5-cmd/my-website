<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七宗罪倾向测试 · 升级版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@300;400;500;600;700;900&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080c;
  --bg-2: #0e0e16;
  --gold: #D4AF37;
  --gold-dim: #9a7e26;
  --text: #EDE5D8;
  --text-dim: #908a80;
  --text-mute: #4a4640;
  --pride: #9B5DE5;
  --greed: #F0C419;
  --lust: #FF2D75;
  --envy: #00C896;
  --gluttony: #FF7B00;
  --wrath: #FF1744;
  --sloth: #6B7B9E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{width:100%}
body{min-height:100vh;background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}

.screen{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s cubic-bezier(.4,0,.2,1)}
.screen.active{opacity:1;pointer-events:auto}

/* ============ Intro ============ */
#introScreen{flex-direction:column;padding:40px 20px;overflow-y:auto}
.intro-wrap{text-align:center;max-width:620px;animation:rise 1.4s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.heptagon-mark{margin:0 auto 18px;width:100px;height:100px;position:relative;animation:heptSpin 30s linear infinite}
@keyframes heptSpin{to{transform:rotate(360deg)}}
.heptagon-mark svg{width:100%;height:100%}
.roman{font-family:'Cinzel',serif;font-size:clamp(80px,14vw,160px);font-weight:700;color:transparent;-webkit-text-stroke:1.5px var(--gold);letter-spacing:.04em;line-height:.9;margin-bottom:6px;filter:drop-shadow(0 0 30px rgba(212,175,55,.12))}
.intro-title{font-family:'Noto Serif SC',serif;font-size:clamp(32px,5.5vw,52px);font-weight:700;letter-spacing:.35em;margin-bottom:8px;text-indent:.35em;text-shadow:0 0 40px rgba(212,175,55,.15)}
.intro-sub{font-family:'Cinzel',serif;font-size:clamp(11px,1.6vw,14px);color:var(--gold);letter-spacing:.5em;text-indent:.5em;margin-bottom:4px}
.intro-tag{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--text-dim);letter-spacing:.15em;margin-bottom:32px}
.intro-line{width:1px;height:36px;background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);margin:0 auto 32px}
.intro-desc{font-size:14px;line-height:2.1;color:var(--text-dim);margin-bottom:36px;text-align:justify;text-align-last:center}
.sin-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin-bottom:40px}
.sin-chip{display:flex;align-items:center;gap:7px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-dim);transition:.3s;cursor:default}
.sin-chip:hover{color:var(--text);transform:translateY(-2px)}
.sin-chip .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor;transition:.3s}
.sin-chip:hover .dot{transform:scale(1.4)}
.start-btn{position:relative;font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);padding:16px 60px;letter-spacing:.35em;text-indent:.35em;cursor:pointer;overflow:hidden;transition:.4s}
.start-btn::before{content:'';position:absolute;inset:0;left:-100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.18),transparent);transition:left .7s}
.start-btn:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 40px rgba(212,175,55,.18),inset 0 0 30px rgba(212,175,55,.06);letter-spacing:.4em}
.start-btn:hover::before{left:100%}
.intro-foot{margin-top:22px;font-size:12px;color:var(--text-mute);letter-spacing:.12em}

/* ============ Quiz ============ */
#quizScreen{flex-direction:column;padding:0 20px}
.progress-bar{position:fixed;top:0;left:0;width:100%;z-index:10;padding:22px 36px 0}
.progress-track{width:100%;height:2px;background:rgba(212,175,55,.07);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(212,175,55,.4)}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:'Cinzel',serif;font-size:12px;color:var(--text-dim);letter-spacing:.18em}
.progress-info .lbl{color:var(--text-mute)}
.quiz-box{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center}
.q-card{width:100%;text-align:center}
.q-roman{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.35em;margin-bottom:26px;opacity:.7;transition:color .4s}
.q-text{font-family:'Noto Serif SC',serif;font-size:clamp(20px,3.2vw,27px);font-weight:500;line-height:1.85;margin-bottom:42px;min-height:2em;transition:color .4s}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{display:flex;align-items:center;gap:16px;padding:16px 22px;background:rgba(255,255,255,.022);border:1px solid rgba(212,175,55,.1);border-radius:8px;cursor:pointer;transition:.3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(6px);user-select:none}
.opt:hover{background:rgba(255,255,255,.04);border-color:rgba(212,175,55,.25);transform:translateX(5px)}
.opt-num{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--text-mute);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--text-mute);border-radius:50%;flex-shrink:0;transition:.3s}
.opt:hover .opt-num{border-color:var(--gold);color:var(--gold)}
.opt-txt{font-family:'Noto Serif SC',serif;font-size:15px;flex:1;text-align:left;letter-spacing:.04em}
.opt-dots{display:flex;gap:5px;flex-shrink:0}
.opt-dots .d{width:7px;height:7px;border-radius:50%;border:1px solid var(--text-mute);transition:.3s}
.opt-dots .d.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(212,175,55,.5)}
.opt.sel{border-color:var(--sin-c)!important;background:color-mix(in srgb,var(--sin-c) 10%,transparent)!important}
.opt.sel .opt-num{background:var(--sin-c);color:#000;border-color:var(--sin-c)}
.opt.sel .opt-dots .d.on{background:var(--sin-c);border-color:var(--sin-c)}
.quiz-nav{margin-top:34px}
.nav-btn{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-dim);background:transparent;border:1px solid rgba(212,175,55,.1);padding:10px 26px;cursor:pointer;transition:.3s;letter-spacing:.1em;border-radius:6px}
.nav-btn:hover:not(:disabled){color:var(--text);border-color:rgba(212,175,55,.25)}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}
.slide-out{animation:sOut .35s ease forwards}
.slide-in{animation:sIn .35s ease forwards}
@keyframes sOut{to{opacity:0;transform:translateX(-40px)}}
@keyframes sIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ============ Loading ============ */
#loadingScreen{flex-direction:column;gap:36px}
.load-hept{width:90px;height:90px;animation:spin 2.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--text-dim);letter-spacing:.25em;animation:blink 1.8s ease infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ Results ============ */
#resultsScreen{flex-direction:column;align-items:center;padding:40px 16px 80px;overflow-y:auto;height:100vh}
.res-wrap{max-width:860px;width:100%;display:flex;flex-direction:column;align-items:center;gap:0}

/* Header with decorative ornaments */
.res-head{text-align:center;margin-bottom:28px;animation:rise .8s ease;position:relative}
.res-head .ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.res-head .ornament .line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.res-head .ornament .line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.res-head .ornament .diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px var(--gold)}
.res-head h2{font-family:'Noto Serif SC',serif;font-size:clamp(20px,3.2vw,30px);font-weight:700;letter-spacing:.25em;text-indent:.25em;margin-bottom:6px}
.res-head .sub{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:.4em;text-indent:.4em}

/* Radar hero card — glass morphism with gold frame */
.radar-card{position:relative;width:100%;max-width:580px;margin:0 auto;padding:20px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid rgba(212,175,55,.1);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(212,175,55,.04),inset 0 1px 0 rgba(255,255,255,.05);overflow:visible;animation:rise 1s cubic-bezier(.16,1,.3,1) .2s both}
.radar-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,transparent,var(--dom-c,var(--gold)) 30%,var(--dom-c,var(--gold)) 70%,transparent);box-shadow:0 0 20px var(--dom-c,var(--gold));opacity:.6}
/* Gold corner ornaments */
.radar-card .corner{position:absolute;width:18px;height:18px;border:1.5px solid var(--gold-dim);opacity:.4}
.radar-card .corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.radar-card .corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.radar-card .corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 6px}
.radar-card .corner.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.radar-card-inner{position:relative;overflow:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;min-height:400px}
#radarCanvas{display:block}
/* Rotating decorative ring behind radar */
.radar-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;aspect-ratio:1;pointer-events:none;animation:ringSpin 40s linear infinite;opacity:.15}
@keyframes ringSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* Verdict card — dominant sin showcase */
.verdict-card{width:100%;max-width:540px;margin:24px auto 0;position:relative;padding:40px 28px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.025),rgba(255,255,255,.005));border:1px solid rgba(255,255,255,.05);overflow:hidden;animation:rise 1s cubic-bezier(.16,1,.3,1) .5s both}
.verdict-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--dom-c,var(--gold))08,transparent 60%);pointer-events:none}
.verdict-label{font-family:'Cinzel',serif;font-size:10px;color:var(--text-mute);letter-spacing:.5em;text-indent:.5em;text-align:center;margin-bottom:6px;position:relative;z-index:1}
.verdict-trait{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--dom-c,var(--gold));letter-spacing:.3em;text-indent:.3em;text-align:center;margin-bottom:20px;position:relative;z-index:1;opacity:.8}
.verdict-name{font-family:'Noto Serif SC',serif;font-size:clamp(44px,7vw,64px);font-weight:900;letter-spacing:.1em;text-indent:.1em;line-height:1;text-align:center;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 0 50px var(--dom-c,var(--gold))}
.verdict-latin{font-family:'Cinzel',serif;font-size:18px;font-weight:500;letter-spacing:.3em;text-indent:.3em;text-align:center;margin-bottom:24px;opacity:.6;position:relative;z-index:1}
.verdict-pct-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:24px;position:relative;z-index:1}
.verdict-pct{font-family:'Cinzel',serif;font-size:clamp(48px,8vw,72px);font-weight:700;line-height:1;letter-spacing:-.02em}
.verdict-pct .sym{font-size:.3em;font-weight:400;color:var(--text-dim);margin-left:2px}
.verdict-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;position:relative;z-index:1}
.verdict-divider .ln{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--dom-c,var(--gold))80)}
.verdict-divider .ln.r{background:linear-gradient(90deg,var(--dom-c,var(--gold))80,transparent)}
.verdict-divider .dot{width:5px;height:5px;border-radius:50%;background:var(--dom-c,var(--gold));box-shadow:0 0 8px var(--dom-c,var(--gold))}
.verdict-desc{font-family:'Noto Serif SC',serif;font-size:15px;line-height:2.2;color:var(--text-dim);text-align:justify;text-align-last:center;max-width:460px;margin:0 auto;position:relative;z-index:1}

/* Sin cards grid */
.sin-grid{width:100%;max-width:680px;margin:44px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sin-grid-title{text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-mute);letter-spacing:.3em;text-indent:.3em;margin-bottom:18px;grid-column:1/-1}
.sin-card{position:relative;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);overflow:hidden;transition:.4s cubic-bezier(.4,0,.2,1);opacity:0;animation:sIn .5s ease forwards}
.sin-card:hover{background:rgba(255,255,255,.035);transform:translateY(-3px)}
.sin-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.sin-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sin-card-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600}
.sin-card-pct{font-family:'Cinzel',serif;font-size:18px;font-weight:700}
.sin-card-latin{font-family:'Cinzel',serif;font-size:9px;color:var(--text-mute);letter-spacing:.15em;margin-bottom:10px;text-transform:uppercase}
.sin-card-bar-bg{height:4px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.sin-card-bar{height:100%;border-radius:2px;width:0;transition:width 1.2s cubic-bezier(.16,1,.3,1) .5s}
.sin-card.is-dom{border-color:rgba(255,255,255,.08)}
.sin-card .dom-tag{position:absolute;top:8px;right:12px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.2em;color:var(--text-mute);opacity:.6}

/* Refined ranking list */
.rank-list{width:100%;max-width:600px;margin:36px auto 0;display:flex;flex-direction:column;gap:12px}
.rank-title{text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-mute);letter-spacing:.3em;text-indent:.3em;margin-bottom:4px}
.rank-row{display:flex;align-items:center;gap:14px;opacity:0;animation:sIn .5s ease forwards;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-family:'Cinzel',serif;font-size:12px;font-weight:600;width:20px;text-align:center;opacity:.4}
.rank-name{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;width:50px;flex-shrink:0;text-align:right}
.rank-latin{font-family:'Cinzel',serif;font-size:10px;color:var(--text-mute);width:66px;flex-shrink:0;letter-spacing:.08em}
.rank-bar-bg{flex:1;height:5px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}
.rank-bar{height:100%;border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.16,1,.3,1) .4s}
.rank-pct{font-family:'Cinzel',serif;font-size:13px;font-weight:600;width:44px;flex-shrink:0;text-align:right}

/* Footer */
.res-foot{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:16px}
.res-foot-line{width:1px;height:30px;background:linear-gradient(180deg,transparent,var(--gold-dim),transparent)}
.restart-btn{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);padding:14px 48px;letter-spacing:.3em;text-indent:.3em;cursor:pointer;transition:.4s;border-radius:10px;position:relative;overflow:hidden}
.restart-btn::before{content:'';position:absolute;inset:0;left:-100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.12),transparent);transition:left .6s}
.restart-btn:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 30px rgba(212,175,55,.15)}
.restart-btn:hover::before{left:100%}
.res-foot-note{font-size:11px;color:var(--text-mute);letter-spacing:.15em}

/* Responsive */
@media(max-width:768px){
  .progress-bar{padding:16px 18px 0}
  .verdict-desc{text-align:center}
  .rank-latin{display:none}
  .opt{padding:14px 16px;gap:10px}
  .sin-chips{gap:6px 14px}
  .sin-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .q-text{font-size:18px;margin-bottom:32px}
  .opt-dots{display:none}
  .opt-num{width:24px;height:24px;font-size:12px}
  .verdict-card{padding:32px 18px}
  .radar-card{padding:16px}
}
</style>
<style>
/* ===== Protection CSS ===== */
body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
</style>

<body>

<canvas id="bgCanvas" width="328" height="741"></canvas>
<div class="vignette"></div>

<!-- ===== Intro ===== -->
<div id="introScreen" class="screen active">
  <div class="intro-wrap">
    <div class="heptagon-mark">
      <svg viewBox="0 0 100 100">
        <polygon points="50,6 88,28.5 88,71.5 50,94 12,71.5 12,28.5" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".4"></polygon>
        <polygon points="50,20 74,34 74,66 50,80 26,66 26,34" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".2"></polygon>
        <circle cx="50" cy="50" r="3" fill="#D4AF37" opacity=".5"></circle>
      </svg>
    </div>
    <div class="roman">VII</div>
    <div class="intro-title">七宗罪</div>
    <div class="intro-sub">SEVEN DEADLY SINS</div>
    <div class="intro-tag">深层人格倾向测试 · 升级版</div>
    <div class="intro-line"></div>
    <p class="intro-desc">
      傲慢、贪婪、色欲、嫉妒、暴食、暴怒、懒惰——七种深植于人性底色的原始倾向。
      它们并非善恶的标签，而是灵魂的棱镜，折射出你内心最真实的渴望与恐惧。
      42道题，带你深入探索自己性格中隐藏的七宗罪分布。
      请凭直觉作答，让潜意识替你说话。
    </p>
    <div class="sin-chips" id="sinChips"><div class="sin-chip"><span class="dot" style="background:#9B5DE5;color:#9B5DE5"></span>傲慢</div><div class="sin-chip"><span class="dot" style="background:#F0C419;color:#F0C419"></span>贪婪</div><div class="sin-chip"><span class="dot" style="background:#FF2D75;color:#FF2D75"></span>色欲</div><div class="sin-chip"><span class="dot" style="background:#00C896;color:#00C896"></span>嫉妒</div><div class="sin-chip"><span class="dot" style="background:#FF7B00;color:#FF7B00"></span>暴食</div><div class="sin-chip"><span class="dot" style="background:#FF1744;color:#FF1744"></span>暴怒</div><div class="sin-chip"><span class="dot" style="background:#6B7B9E;color:#6B7B9E"></span>懒惰</div></div>
    
    <div class="intro-foot">共 42 题 · 约 5 分钟</div>
  </div>
</div>

<!-- ===== Quiz ===== -->
<div id="quizScreen" class="screen">
  <div class="progress-bar">
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-info">
      <span class="lbl">QUESTION</span>
      <span id="progCount">01 / 42</span>
    </div>
  </div>
  <div class="quiz-box">
    <div class="q-card" id="qCard">
      <div class="q-roman" id="qRoman">I</div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="quiz-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevQ()">← 上一题</button>
    </div>
  </div>
</div>

<!-- ===== Loading ===== -->
<div id="loadingScreen" class="screen">
  <div class="load-hept">
    <svg viewBox="0 0 90 90">
      <polygon points="45,6 79,26 79,64 45,84 11,64 11,26" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity=".5"></polygon>
      <polygon points="45,22 64,33 64,57 45,68 26,57 26,33" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".25"></polygon>
    </svg>
  </div>
