<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七宗罪倾向测试 · 升级版</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@300;400;500;600;700;900&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080c;
  --bg-2: #0e0e16;
  --gold: #D4AF37;
  --gold-dim: #9a7e26;
  --text: #EDE5D8;
  --text-dim: #908a80;
  --text-mute: #4a4640;
  --pride: #9B5DE5;
  --greed: #F0C419;
  --lust: #FF2D75;
  --envy: #00C896;
  --gluttony: #FF7B00;
  --wrath: #FF1744;
  --sloth: #6B7B9E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{width:100%}
body{min-height:100vh;background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}

.screen{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s cubic-bezier(.4,0,.2,1)}
.screen.active{opacity:1;pointer-events:auto}

/* ============ Intro ============ */
#introScreen{flex-direction:column;padding:40px 20px;overflow-y:auto}
.intro-wrap{text-align:center;max-width:620px;animation:rise 1.4s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.heptagon-mark{margin:0 auto 18px;width:100px;height:100px;position:relative;animation:heptSpin 30s linear infinite}
@keyframes heptSpin{to{transform:rotate(360deg)}}
.heptagon-mark svg{width:100%;height:100%}
.roman{font-family:'Cinzel',serif;font-size:clamp(80px,14vw,160px);font-weight:700;color:transparent;-webkit-text-stroke:1.5px var(--gold);letter-spacing:.04em;line-height:.9;margin-bottom:6px;filter:drop-shadow(0 0 30px rgba(212,175,55,.12))}
.intro-title{font-family:'Noto Serif SC',serif;font-size:clamp(32px,5.5vw,52px);font-weight:700;letter-spacing:.35em;margin-bottom:8px;text-indent:.35em;text-shadow:0 0 40px rgba(212,175,55,.15)}
.intro-sub{font-family:'Cinzel',serif;font-size:clamp(11px,1.6vw,14px);color:var(--gold);letter-spacing:.5em;text-indent:.5em;margin-bottom:4px}
.intro-tag{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--text-dim);letter-spacing:.15em;margin-bottom:32px}
.intro-line{width:1px;height:36px;background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);margin:0 auto 32px}
.intro-desc{font-size:14px;line-height:2.1;color:var(--text-dim);margin-bottom:36px;text-align:justify;text-align-last:center}
.sin-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin-bottom:40px}
.sin-chip{display:flex;align-items:center;gap:7px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-dim);transition:.3s;cursor:default}
.sin-chip:hover{color:var(--text);transform:translateY(-2px)}
.sin-chip .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor;transition:.3s}
.sin-chip:hover .dot{transform:scale(1.4)}
.start-btn{position:relative;font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);padding:16px 60px;letter-spacing:.35em;text-indent:.35em;cursor:pointer;overflow:hidden;transition:.4s}
.start-btn::before{content:'';position:absolute;inset:0;left:-100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.18),transparent);transition:left .7s}
.start-btn:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 40px rgba(212,175,55,.18),inset 0 0 30px rgba(212,175,55,.06);letter-spacing:.4em}
.start-btn:hover::before{left:100%}
.intro-foot{margin-top:22px;font-size:12px;color:var(--text-mute);letter-spacing:.12em}

/* ============ Quiz ============ */
#quizScreen{flex-direction:column;padding:0 20px}
.progress-bar{position:fixed;top:0;left:0;width:100%;z-index:10;padding:22px 36px 0}
.progress-track{width:100%;height:2px;background:rgba(212,175,55,.07);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(212,175,55,.4)}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:'Cinzel',serif;font-size:12px;color:var(--text-dim);letter-spacing:.18em}
.progress-info .lbl{color:var(--text-mute)}
.quiz-box{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center}
.q-card{width:100%;text-align:center}
.q-roman{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.35em;margin-bottom:26px;opacity:.7;transition:color .4s}
.q-text{font-family:'Noto Serif SC',serif;font-size:clamp(20px,3.2vw,27px);font-weight:500;line-height:1.85;margin-bottom:42px;min-height:2em;transition:color .4s}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{display:flex;align-items:center;gap:16px;padding:16px 22px;background:rgba(255,255,255,.022);border:1px solid rgba(212,175,55,.1);border-radius:8px;cursor:pointer;transition:.3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(6px);user-select:none}
.opt:hover{background:rgba(255,255,255,.04);border-color:rgba(212,175,55,.25);transform:translateX(5px)}
.opt-num{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--text-mute);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--text-mute);border-radius:50%;flex-shrink:0;transition:.3s}
.opt:hover .opt-num{border-color:var(--gold);color:var(--gold)}
.opt-txt{font-family:'Noto Serif SC',serif;font-size:15px;flex:1;text-align:left;letter-spacing:.04em}
.opt-dots{display:flex;gap:5px;flex-shrink:0}
.opt-dots .d{width:7px;height:7px;border-radius:50%;border:1px solid var(--text-mute);transition:.3s}
.opt-dots .d.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(212,175,55,.5)}
.opt.sel{border-color:var(--sin-c)!important;background:color-mix(in srgb,var(--sin-c) 10%,transparent)!important}
.opt.sel .opt-num{background:var(--sin-c);color:#000;border-color:var(--sin-c)}
.opt.sel .opt-dots .d.on{background:var(--sin-c);border-color:var(--sin-c)}
.quiz-nav{margin-top:34px}
.nav-btn{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-dim);background:transparent;border:1px solid rgba(212,175,55,.1);padding:10px 26px;cursor:pointer;transition:.3s;letter-spacing:.1em;border-radius:6px}
.nav-btn:hover:not(:disabled){color:var(--text);border-color:rgba(212,175,55,.25)}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}
.slide-out{animation:sOut .35s ease forwards}
.slide-in{animation:sIn .35s ease forwards}
@keyframes sOut{to{opacity:0;transform:translateX(-40px)}}
@keyframes sIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ============ Loading ============ */
#loadingScreen{flex-direction:column;gap:36px}
.load-hept{width:90px;height:90px;animation:spin 2.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--text-dim);letter-spacing:.25em;animation:blink 1.8s ease infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ Results ============ */
#resultsScreen{flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 16px 80px;overflow-y:auto;height:100vh}
.res-wrap{max-width:860px;width:100%;display:flex;flex-direction:column;align-items:center;gap:0}

/* Header */
.res-head{text-align:center;margin-bottom:28px;animation:rise .8s ease;position:relative}
.res-head .ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.res-head .ornament .line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.res-head .ornament .line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.res-head .ornament .diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px var(--gold)}
.res-head h2{font-family:'Noto Serif SC',serif;font-size:clamp(20px,3.2vw,30px);font-weight:700;letter-spacing:.25em;text-indent:.25em;margin-bottom:6px}
.res-head .sub{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:.4em;text-indent:.4em}

/* === SVG Radar Card (from second page) === */
.radar-card{position:relative;width:100%;max-width:580px;margin:0 auto;padding:20px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid rgba(212,175,55,.1);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(212,175,55,.04),inset 0 1px 0 rgba(255,255,255,.05);overflow:visible;animation:rise 1s cubic-bezier(.16,1,.3,1) .2s both}
.radar-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,transparent,var(--dom-c,var(--gold)) 30%,var(--dom-c,var(--gold)) 70%,transparent);box-shadow:0 0 20px var(--dom-c,var(--gold));opacity:.6}
.radar-card .corner{position:absolute;width:18px;height:18px;border:1.5px solid var(--gold-dim);opacity:.4}
.radar-card .corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.radar-card .corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.radar-card .corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 6px}
.radar-card .corner.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.radar-card-inner{position:relative;overflow:visible;border-radius:16px;display:flex;align-items:center;justify-content:center;min-height:420px}
#radarSvg{display:block;width:100%;max-width:520px;aspect-ratio:1/1;overflow:visible}
#burstSvg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;max-width:520px;aspect-ratio:1/1;pointer-events:none;overflow:visible}
.radar-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;aspect-ratio:1;pointer-events:none;animation:ringSpin 40s linear infinite;opacity:.15}
@keyframes ringSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* SVG radar element styles */
.rgrid{fill:none;stroke:rgba(180,140,100,0.1);stroke-width:1}
.rgrid.outer{stroke:rgba(212,175,55,0.15)}
.raxis{stroke:rgba(180,140,100,0.06);stroke-width:1}
.rdata{transition:opacity 0.8s ease;opacity:0}
.rdata.shown{opacity:1}
.rpoint{opacity:0;transition:opacity 0.3s ease}
.rpoint.shown{opacity:1}
.rlabel-cn{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
.rlabel-en{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.15em;text-anchor:middle;dominant-baseline:middle;opacity:.5}
.rlabel-pct{font-family:'Cinzel',serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
.rscale{font-family:'Cinzel',serif;font-size:8px;fill:rgba(144,138,128,0.25);text-anchor:start}
.burst-cone{opacity:0;transition:opacity 0.8s ease 1.5s}
.burst-cone.shown{opacity:0.8}
.burst-ray{opacity:0;transition:opacity 0.5s ease}
.burst-ray.shown{opacity:0.7}
.burst-core{opacity:0;transition:opacity 0.3s ease 1.2s}
.burst-core.shown{opacity:1}
.burst-text{opacity:0;transition:opacity 0.5s ease 2s;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:2px;text-anchor:middle;dominant-baseline:middle}
.burst-text.shown{opacity:0.8}

/* Verdict card — dominant sin showcase */
.verdict-card{width:100%;max-width:540px;margin:24px auto 0;position:relative;padding:40px 28px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.025),rgba(255,255,255,.005));border:1px solid rgba(255,255,255,.05);overflow:hidden;animation:rise 1s cubic-bezier(.16,1,.3,1) .5s both}
.verdict-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--dom-c,var(--gold)) 8%,transparent),transparent 60%);pointer-events:none}
.verdict-label{font-family:'Cinzel',serif;font-size:10px;color:var(--text-mute);letter-spacing:.5em;text-indent:.5em;text-align:center;margin-bottom:6px;position:relative;z-index:1}
.verdict-trait{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--dom-c,var(--gold));letter-spacing:.3em;text-indent:.3em;text-align:center;margin-bottom:20px;position:relative;z-index:1;opacity:.8}
.verdict-name{font-family:'Noto Serif SC',serif;font-size:clamp(44px,7vw,64px);font-weight:900;letter-spacing:.1em;text-indent:.1em;line-height:1;text-align:center;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 0 50px var(--dom-c,var(--gold))}
.verdict-latin{font-family:'Cinzel',serif;font-size:18px;font-weight:500;letter-spacing:.3em;text-indent:.3em;text-align:center;margin-bottom:24px;opacity:.6;position:relative;z-index:1}
.verdict-pct-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:24px;position:relative;z-index:1}
.verdict-pct{font-family:'Cinzel',serif;font-size:clamp(48px,8vw,72px);font-weight:700;line-height:1;letter-spacing:-.02em}
.verdict-pct .sym{font-size:.3em;font-weight:400;color:var(--text-dim);margin-left:2px}
.verdict-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;position:relative;z-index:1}
.verdict-divider .ln{width:50px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--dom-c,var(--gold)) 80%,transparent))}
.verdict-divider .ln.r{background:linear-gradient(90deg,color-mix(in srgb,var(--dom-c,var(--gold)) 80%,transparent),transparent)}
.verdict-divider .dot{width:5px;height:5px;border-radius:50%;background:var(--dom-c,var(--gold));box-shadow:0 0 8px var(--dom-c,var(--gold))}
.verdict-desc{font-family:'Noto Serif SC',serif;font-size:15px;line-height:2.2;color:var(--text-dim);text-align:justify;text-align-last:center;max-width:460px;margin:0 auto;position:relative;z-index:1}

/* Sin cards grid */
.sin-grid{width:100%;max-width:680px;margin:44px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sin-grid-title{text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-mute);letter-spacing:.3em;text-indent:.3em;margin-bottom:18px;grid-column:1/-1}
.sin-card{position:relative;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);overflow:hidden;transition:.4s cubic-bezier(.4,0,.2,1);opacity:0;animation:sIn .5s ease forwards}
.sin-card:hover{background:rgba(255,255,255,.035);transform:translateY(-3px)}
.sin-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.sin-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sin-card-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600}
.sin-card-pct{font-family:'Cinzel',serif;font-size:18px;font-weight:700}
.sin-card-latin{font-family:'Cinzel',serif;font-size:9px;color:var(--text-mute);letter-spacing:.15em;margin-bottom:10px;text-transform:uppercase}
.sin-card-bar-bg{height:4px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.sin-card-bar{height:100%;border-radius:2px;width:0;transition:width 1.2s cubic-bezier(.16,1,.3,1) .5s}
.sin-card.is-dom{border-color:rgba(255,255,255,.08)}
.sin-card .dom-tag{position:absolute;top:8px;right:12px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.2em;color:var(--text-mute);opacity:.6}

/* Ranking list */
.rank-list{width:100%;max-width:600px;margin:36px auto 0;display:flex;flex-direction:column;gap:12px}
.rank-title{text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text-mute);letter-spacing:.3em;text-indent:.3em;margin-bottom:4px}
.rank-row{display:flex;align-items:center;gap:14px;opacity:0;animation:sIn .5s ease forwards;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-family:'Cinzel',serif;font-size:12px;font-weight:600;width:20px;text-align:center;opacity:.4}
.rank-name{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;width:50px;flex-shrink:0;text-align:right}
.rank-latin{font-family:'Cinzel',serif;font-size:10px;color:var(--text-mute);width:66px;flex-shrink:0;letter-spacing:.08em}
.rank-bar-bg{flex:1;height:5px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}
.rank-bar{height:100%;border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.16,1,.3,1) .4s}
.rank-pct{font-family:'Cinzel',serif;font-size:13px;font-weight:600;width:44px;flex-shrink:0;text-align:right}

/* Footer */
.res-foot{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:16px}
.res-foot-line{width:1px;height:30px;background:linear-gradient(180deg,transparent,var(--gold-dim),transparent)}
.restart-btn{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);padding:14px 48px;letter-spacing:.3em;text-indent:.3em;cursor:pointer;transition:.4s;border-radius:10px;position:relative;overflow:hidden}
.restart-btn::before{content:'';position:absolute;inset:0;left:-100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.12),transparent);transition:left .6s}
.restart-btn:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 30px rgba(212,175,55,.15)}
.restart-btn:hover::before{left:100%}
.res-foot-note{font-size:11px;color:var(--text-mute);letter-spacing:.15em}

/* Responsive */
@media(max-width:768px){
  .progress-bar{padding:16px 18px 0}
  .verdict-desc{text-align:center}
  .rank-latin{display:none}
  .opt{padding:14px 16px;gap:10px}
  .sin-chips{gap:6px 14px}
  .sin-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .q-text{font-size:18px;margin-bottom:32px}
  .opt-dots{display:none}
  .opt-num{width:24px;height:24px;font-size:12px}
  .verdict-card{padding:32px 18px}
  .radar-card{padding:16px}
}
</style>
<style>
/* ===== Protection CSS ===== */
body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
</style>

<body>
<canvas id="bgCanvas" width="491" height="931"></canvas>
<div class="vignette"></div>

<!-- ===== Intro ===== -->
<div id="introScreen" class="screen active">
  <div class="intro-wrap">
    <div class="heptagon-mark">
      <svg viewBox="0 0 100 100">
        <polygon points="50,6 88,28.5 88,71.5 50,94 12,71.5 12,28.5" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".4"></polygon>
        <polygon points="50,20 74,34 74,66 50,80 26,66 26,34" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".2"></polygon>
        <circle cx="50" cy="50" r="3" fill="#D4AF37" opacity=".5"></circle>
      </svg>
    </div>
    <div class="roman">VII</div>
    <div class="intro-title">七宗罪</div>
    <div class="intro-sub">SEVEN DEADLY SINS</div>
    <div class="intro-tag">深层人格倾向测试 · 升级版</div>
    <div class="intro-line"></div>
    <p class="intro-desc">
      傲慢、贪婪、色欲、嫉妒、暴食、暴怒、懒惰——七种深植于人性底色的原始倾向。
      它们并非善恶的标签，而是灵魂的棱镜，折射出你内心最真实的渴望与恐惧。
      42道题，带你深入探索自己性格中隐藏的七宗罪分布。

const OPTS = [
  {l:'完全不符合',v:1},
  {l:'较不符合',v:2},
  {l:'一般',v:3},
  {l:'较符合',v:4},
  {l:'完全符合',v:5}
];

const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI','XXXII','XXXIII','XXXIV','XXXV','XXXVI','XXXVII','XXXVIII','XXXIX','XL','XLI','XLII'];

// ===== State =====
let shuf = [], idx = 0, ans = [], sc = {};

function init(){
  const chips = document.getElementById('sinChips');
  SINS.forEach(s=>{
    const c = document.createElement('div');
    c.className='sin-chip';
    c.innerHTML=`<span class="dot" style="background:${s.color};color:${s.color}"></span>${s.name}`;
    chips.appendChild(c);
  });
  bgParticles();
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function startQuiz(){
  shuf = shuffle(QUESTIONS);
  idx = 0; ans = new Array(QUESTIONS.length).fill(null);
  sc = {}; SINS.forEach(s=>sc[s.id]=0);
  switchScreen('introScreen','quizScreen');
  setTimeout(renderQ, 300);
}

function renderQ(){
  const q = shuf[idx];
  const sinC = SINS.find(s=>s.id===q.s).color;
  document.getElementById('qRoman').textContent = ROMAN[idx];
  document.getElementById('qRoman').style.color = sinC;
  const qt = document.getElementById('qText');
  qt.textContent = q.t; qt.style.color = sinC;
  document.getElementById('progFill').style.width = (idx/QUESTIONS.length*100)+'%';
  document.getElementById('progCount').textContent = String(idx+1).padStart(2,'0')+' / '+String(QUESTIONS.length).padStart(2,'0');
  const od = document.getElementById('opts');
  od.innerHTML = '';
  OPTS.forEach((o,i)=>{
    const d = document.createElement('div');
    d.className='opt';
    d.style.setProperty('--sin-c', sinC);
    if(ans[idx]&&ans[idx].v===o.v) d.classList.add('sel');
    let dots=''; for(let k=0;k<5;k++) dots+=`<span class="d ${k<o.v?'on':''}"></span>`;
    d.innerHTML=`<span class="opt-num">${i+1}</span><span class="opt-txt">${o.l}</span><span class="opt-dots">${dots}</span>`;
    d.addEventListener('mouseenter',()=>{d.style.borderColor=sinC+'55';d.style.background=sinC+'0c'});
    d.addEventListener('mouseleave',()=>{if(!d.classList.contains('sel')){d.style.borderColor='';d.style.background=''}});
    d.addEventListener('click',()=>selectA(o.v, q.s, sinC));
    od.appendChild(d);
  });
  document.getElementById('prevBtn').disabled = idx===0;
}

function selectA(v, s, sinC){
  const prev = ans[idx];
  if(prev) sc[prev.s]-=prev.v;
  ans[idx]={v, s}; sc[s]+=v;
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.classList.toggle('sel', OPTS[i].v===v);
    if(OPTS[i].v===v){el.style.borderColor=sinC;el.style.background=sinC+'14'}
    else{el.style.borderColor='';el.style.background=''}
  });
  setTimeout(()=>{
    if(idx<QUESTIONS.length-1){
      const c=document.getElementById('qCard');
      c.classList.add('slide-out');
      setTimeout(()=>{idx++;c.classList.remove('slide-out');c.classList.add('slide-in');renderQ();setTimeout(()=>c.classList.remove('slide-in'),350)},320);
    } else { showLoading(); }
  }, 280);
}

function prevQ(){
  if(idx>0){
    const c=document.getElementById('qCard');
    c.style.animation='sIn .3s ease reverse forwards';
    setTimeout(()=>{c.style.animation='';idx--;renderQ()},300);
  }
}

function showLoading(){
  document.getElementById('progFill').style.width='100%';
  switchScreen('quizScreen','loadingScreen');
  setTimeout(()=>{switchScreen('loadingScreen','resultsScreen');setTimeout(renderResults,400)},2000);
}

function renderResults(){
  const maxS = 30;
  const results = SINS.map(s=>({...s, raw:sc[s.id]||0, pct:Math.round((sc[s.id]||0)/maxS*100)}));
  const sorted = [...results].sort((a,b)=>b.raw-a.raw);
  const dom = sorted[0];

  document.documentElement.style.setProperty('--dom-c', dom.color);
  document.getElementById('radarCard').style.setProperty('--dom-c', dom.color);
  document.getElementById('verdictCard').style.setProperty('--dom-c', dom.color);

  // === Verdict card ===
  const vc = document.getElementById('verdictCard');
  vc.innerHTML = `
    <div class="verdict-label">YOUR DOMINANT SIN</div>
    <div class="verdict-trait">「 ${dom.trait} 」</div>
    <div class="verdict-name" style="color:${dom.color}">${dom.name}</div>
    <div class="verdict-latin" style="color:${dom.color}">${dom.latin}</div>
    <div class="verdict-pct-wrap">
      <span class="verdict-pct" style="color:${dom.color}" id="verdictPct">0<span class="sym">%</span></span>
    </div>
    <div class="verdict-divider">
      <span class="ln"></span><span class="dot" style="background:${dom.color};box-shadow:0 0 8px ${dom.color}"></span><span class="ln r"></span>
    </div>
    <div class="verdict-desc">${dom.desc}</div>
  `;

  // === Animated percentage counter ===
  setTimeout(()=>{
    const pctEl = document.getElementById('verdictPct');
    let cur = 0;
    const target = dom.pct;
    const step = Math.max(1, Math.ceil(target / 30));
    const tick = ()=>{
      cur += step;
      if(cur >= target){cur = target; pctEl.innerHTML = cur + '<span class="sym">%</span>'; return}
      pctEl.innerHTML = cur + '<span class="sym">%</span>';
      requestAnimationFrame(tick);
    };
    tick();
  }, 700);

  // === Sin cards grid ===
  const sg = document.getElementById('sinGrid');
  sg.innerHTML = '<div class="sin-grid-title">— 七宗罪全息图 —</div>';
  sorted.forEach((r,i)=>{
    const card = document.createElement('div');
    card.className = 'sin-card' + (r.id === dom.id ? ' is-dom' : '');
    card.style.animationDelay = (0.9 + i * 0.08) + 's';
    card.innerHTML = `
      <div class="accent-bar" style="background:linear-gradient(180deg,${r.color},${r.color}40)"></div>
      ${r.id === dom.id ? '<span class="dom-tag">DOMINANT</span>' : ''}
      <div class="sin-card-head">
        <span class="sin-card-name" style="color:${r.color}">${r.name}</span>
        <span class="sin-card-pct" style="color:${r.color}">${r.pct}%</span>
      </div>
      <div class="sin-card-latin">${r.latin} · ${r.trait}</div>
      <div class="sin-card-bar-bg"><div class="sin-card-bar" style="background:linear-gradient(90deg,${r.color}60,${r.color});box-shadow:0 0 6px ${r.color}40"></div></div>
    `;
    sg.appendChild(card);
  });

  // === Ranking list ===
  const rl = document.getElementById('rankList');
  rl.innerHTML = '<div class="rank-title">— 完整排名 —</div>';
  sorted.forEach((r,i)=>{
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.style.animationDelay = (1.2 + i * 0.08) + 's';
    row.innerHTML = `
      <span class="rank-pos">${i+1}</span>
      <span class="rank-name" style="color:${r.color}">${r.name}</span>
      <span class="rank-latin">${r.latin}</span>
      <div class="rank-bar-bg"><div class="rank-bar" style="background:linear-gradient(90deg,${r.color}80,${r.color});box-shadow:0 0 6px ${r.color}50"></div></div>
      <span class="rank-pct" style="color:${r.color}">${r.pct}%</span>
    `;
    rl.appendChild(row);
  });

  // Animate all bars
  setTimeout(()=>{
    document.querySelectorAll('.rank-bar').forEach((b,i)=>{b.style.width = sorted[i].pct + '%'});
    document.querySelectorAll('.sin-card-bar').forEach((b,i)=>{b.style.width = sorted[i].pct + '%'});
  }, 200);

  // === Draw SVG Radar (from second page) ===
  drawSvgRadar(results, dom);
}

// ===== SVG Radar Chart (from second page) =====
function drawSvgRadar(results, dom){
  const svg = document.getElementById('radarSvg');
  const burstSvg = document.getElementById('burstSvg');
  svg.innerHTML=''; burstSvg.innerHTML='';
  const cx=250, cy=250, maxR=170;
  const n=7;
  const baseAngle = -Math.PI/2;
  const ns = 'http://www.w3.org/2000/svg';

  const angles = [];
  for(let i=0;i<n;i++){ angles.push(baseAngle + i*2*Math.PI/n); }

  function pt(angle, r){ return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)]; }

  // Defs
  const defs = document.createElementNS(ns,'defs');
  defs.innerHTML = `
    <filter id="rGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rBurstGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="rBurstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${dom.color}" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="${dom.color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${dom.color}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rDataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="${dom.color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${dom.color}" stop-opacity="0.12"/>
    </linearGradient>
  `;
  svg.appendChild(defs);

  // Grid polygons (5 layers)
  for(let layer=5; layer>=1; layer--){
    const r = maxR * layer/5;
    let pts='';
    for(let i=0;i<n;i++){
      const [x,y]=pt(angles[i],r);
      pts += x+','+y+' ';
    }
    const poly=document.createElementNS(ns,'polygon');
    poly.setAttribute('points',pts.trim());
    poly.setAttribute('class', layer===5?'rgrid outer':'rgrid');
    svg.appendChild(poly);
  }

  // Axis lines
  for(let i=0;i<n;i++){
    const [x,y]=pt(angles[i],maxR);
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',cx); line.setAttribute('y1',cy);
    line.setAttribute('x2',x); line.setAttribute('y2',y);
    line.setAttribute('class','raxis');
    svg.appendChild(line);
  }

  // Scale labels
  for(let layer=1;layer<=5;layer++){
    const r=maxR*layer/5;
    const [x,y]=pt(angles[0]+0.18, r);
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',x+4); t.setAttribute('y',y);
    t.setAttribute('class','rscale');
    t.textContent = (layer*20)+'';
    svg.appendChild(t);
  }

  // Data polygon
  const domIdx = results.findIndex(r => r.id === dom.id);
  let dataPts='';
  const dataCoords=[];
  for(let i=0;i<n;i++){
    const r = maxR * (results[i].pct/100);
    const [x,y]=pt(angles[i], r);
    dataCoords.push([x,y]);
    dataPts += x+','+y+' ';
  }
  const dataPoly=document.createElementNS(ns,'polygon');
  dataPoly.setAttribute('points',dataPts.trim());
  dataPoly.setAttribute('fill','url(#rDataGrad)');
  dataPoly.setAttribute('stroke',dom.color);
  dataPoly.setAttribute('stroke-width','2.5');
  dataPoly.setAttribute('filter','url(#rGlow)');
  dataPoly.classList.add('rdata');
  svg.appendChild(dataPoly);
  requestAnimationFrame(()=>{ setTimeout(()=>dataPoly.classList.add('shown'), 100); });

  // Data points
  dataCoords.forEach(([x,y],i)=>{
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y);
    c.setAttribute('r', i===domIdx?7:4);
    c.setAttribute('fill',results[i].color);
    c.setAttribute('stroke','#EDE5D8');
    c.setAttribute('stroke-width','1.5');
    if(i===domIdx) c.setAttribute('filter','url(#rGlow)');
    c.classList.add('rpoint');
    c.style.transitionDelay = (0.8 + i*0.08)+'s';
    svg.appendChild(c);
    requestAnimationFrame(()=>{ setTimeout(()=>c.classList.add('shown'), 100); });
  });

  // Labels
  for(let i=0;i<n;i++){
    const s=results[i];
    const labelR = maxR + 34;
    const [lx,ly]=pt(angles[i],labelR);
    const isDom = i===domIdx;

    // CN label
    const t1=document.createElementNS(ns,'text');
    t1.setAttribute('x',lx); t1.setAttribute('y',ly-8);
    t1.setAttribute('class','rlabel-cn');
    t1.setAttribute('fill', isDom ? s.color : '#EDE5D8');
    if(isDom){
      t1.setAttribute('font-size','17');
      t1.setAttribute('filter','url(#rGlow)');
    }
    t1.textContent=s.name;
    svg.appendChild(t1);

    // EN label
    const t2=document.createElementNS(ns,'text');
    t2.setAttribute('x',lx); t2.setAttribute('y',ly+7);
    t2.setAttribute('class','rlabel-en');
    t2.setAttribute('fill', isDom ? s.color : '#908a80');
    if(isDom) t2.setAttribute('opacity','0.8');
    t2.textContent=s.latin.toUpperCase();
    svg.appendChild(t2);

    // Score
    const t3=document.createElementNS(ns,'text');
    t3.setAttribute('x',lx); t3.setAttribute('y',ly+22);
    t3.setAttribute('class','rlabel-pct');
    t3.setAttribute('fill', isDom ? s.color : '#4a4640');
    t3.textContent=results[i].pct+'%';
    svg.appendChild(t3);
  }

  // Burst effect for dominant sin
  if(dom.pct >= 60){
    drawBurstEffect(burstSvg, cx, cy, angles[domIdx], maxR, dom, ns);
  }

  // Central core
  const core = document.createElementNS(ns,'circle');
  core.setAttribute('cx',cx); core.setAttribute('cy',cy);
  core.setAttribute('r','8');
  core.setAttribute('fill',dom.color);
  core.setAttribute('filter','url(#rGlow)');
  core.classList.add('rpoint');
  core.style.transitionDelay='1.2s';
  svg.appendChild(core);
  requestAnimationFrame(()=>{ setTimeout(()=>core.classList.add('shown'), 100); });
}

function drawBurstEffect(burstSvg, cx, cy, angle, maxR, dom, ns){
  const defs = document.createElementNS(ns,'defs');
  defs.innerHTML = `
    <radialGradient id="bGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${dom.color}" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="${dom.color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${dom.color}" stop-opacity="0"/>
    </radialGradient>
    <filter id="bGlow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  `;
  burstSvg.appendChild(defs);

  const tipX = cx + (maxR+100)*Math.cos(angle);
  const tipY = cy + (maxR+100)*Math.sin(angle);
  const baseX = cx + maxR*Math.cos(angle);
  const baseY = cy + maxR*Math.sin(angle);

  const perpAngle = angle + Math.PI/2;
  const baseHalf = 18;
  const tipHalf = 58;
  const b1x = baseX + baseHalf*Math.cos(perpAngle), b1y = baseY + baseHalf*Math.sin(perpAngle);
  const b2x = baseX - baseHalf*Math.cos(perpAngle), b2y = baseY - baseHalf*Math.sin(perpAngle);
  const t1x = tipX + tipHalf*Math.cos(perpAngle), t1y = tipY + tipHalf*Math.sin(perpAngle);
  const t2x = tipX - tipHalf*Math.cos(perpAngle), t2y = tipY - tipHalf*Math.sin(perpAngle);

  // Cone
  const cone=document.createElementNS(ns,'polygon');
  cone.setAttribute('points', b1x+','+b1y+' '+t1x+','+t1y+' '+t2x+','+t2y+' '+b2x+','+b2y);
  cone.setAttribute('fill','url(#bGrad2)');
  cone.setAttribute('filter','url(#bGlow3)');
  cone.classList.add('burst-cone');
  burstSvg.appendChild(cone);
  setTimeout(()=>cone.classList.add('shown'), 100);

  // Rays
  const numRays=7;
  for(let i=0;i<numRays;i++){
    const offset = (i - (numRays-1)/2) * (tipHalf*2/numRays) * 0.9;
    const sx = baseX + offset*Math.cos(perpAngle);
    const sy = baseY + offset*Math.sin(perpAngle);
    const ex = tipX + offset*Math.cos(perpAngle)*1.2;
    const ey = tipY + offset*Math.sin(perpAngle)*1.2;
    const ray=document.createElementNS(ns,'line');
    ray.setAttribute('x1',sx); ray.setAttribute('y1',sy);
    ray.setAttribute('x2',ex); ray.setAttribute('y2',ey);
    ray.setAttribute('stroke',dom.color);
    ray.setAttribute('stroke-width', 2 - Math.abs(i-(numRays-1)/2)*0.2);
    ray.setAttribute('filter','url(#bGlow3)');
    ray.classList.add('burst-ray');
    ray.style.transitionDelay = (1.5 + i*0.08)+'s';
    burstSvg.appendChild(ray);
    setTimeout(()=>ray.classList.add('shown'), 100);
  }

  // Pulsing core
  const core=document.createElementNS(ns,'circle');
  core.setAttribute('cx',baseX); core.setAttribute('cy',baseY);
  core.setAttribute('r','6');
  core.setAttribute('fill',dom.color);
  core.setAttribute('filter','url(#bGlow3)');
  core.classList.add('burst-core');
  burstSvg.appendChild(core);
  setTimeout(()=>core.classList.add('shown'), 100);

  // Pulse animation
  setTimeout(()=>{
    let pulseState=false;
    setInterval(()=>{
      pulseState=!pulseState;
      core.setAttribute('r', pulseState?'10':'5');
      cone.setAttribute('opacity', pulseState?'0.6':'0.85');
    }, 600);
  }, 2500);

  // OVERLOAD text
  const midX = (baseX+tipX)/2 + 38*Math.cos(perpAngle);
  const midY = (baseY+tipY)/2 + 38*Math.sin(perpAngle);
  const ovr=document.createElementNS(ns,'text');
  ovr.setAttribute('x',midX); ovr.setAttribute('y',midY);
  ovr.setAttribute('class','burst-text');
  ovr.setAttribute('fill',dom.color);
  ovr.setAttribute('filter','url(#bGlow3)');
  ovr.textContent='OVERLOAD';
  burstSvg.appendChild(ovr);
  setTimeout(()=>ovr.classList.add('shown'), 100);
}

// ===== Background particles =====
function bgParticles(){
  const c = document.getElementById('bgCanvas');
  const ctx = c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight}
  resize(); window.addEventListener('resize',resize);
  const ps = [];
  const n = Math.min(70, Math.floor(window.innerWidth / 22));
  const cols = ['#D4AF37','#C9A84C','#B8932E','#E8C84C','#A67C00'];
  for(let i=0;i<n;i++){
    ps.push({x:Math.random()*c.width,y:Math.random()*c.height,
      sz:Math.random()*1.8+.3,vy:-(Math.random()*.4+.08),vx:(Math.random()-.5)*.18,
      op:Math.random()*.4+.04,col:cols[Math.floor(Math.random()*cols.length)],
      tw:Math.random()*Math.PI*2,ts:Math.random()*.02+.004});
  }
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.tw+=p.ts;
      if(p.y<-10){p.y=c.height+10;p.x=Math.random()*c.width}
      if(p.x<-10)p.x=c.width+10; if(p.x>c.width+10)p.x=-10;
      const al=p.op*(.5+Math.sin(p.tw)*.5);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
      ctx.fillStyle=p.col; ctx.globalAlpha=al;
      ctx.shadowBlur=p.sz*3; ctx.shadowColor=p.col; ctx.fill();
    });
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(loop);
  }
  loop();
}
