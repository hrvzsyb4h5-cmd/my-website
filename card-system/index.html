<script>
// === 实时时间戳 ===
function updateTimestamp(){
  var now=new Date();
  var days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var y=now.getFullYear();
  var m=String(now.getMonth()+1).padStart(2,'0');
  var d=String(now.getDate()).padStart(2,'0');
  var h=String(now.getHours()).padStart(2,'0');
  var mi=String(now.getMinutes()).padStart(2,'0');
  var s=String(now.getSeconds()).padStart(2,'0');
  var el=document.getElementById('timestamp');
  if(el)el.textContent=y+'年'+m+'月'+d+'日 '+days[now.getDay()]+' '+h+':'+mi+':'+s;
}
updateTimestamp();
setInterval(updateTimestamp,1000);

// === 购买按钮跳转（部署后替换为你的发卡系统地址）===
document.getElementById('buyBtn').addEventListener('click',function(e){
  e.preventDefault();
  // TODO: 部署发卡系统后，把下面的 # 替换为你的发卡系统地址
  // 例如: window.location.href = 'https://seven-sins-shop.xxx.workers.dev/';
  alert('发卡系统地址待配置\n\n请部署发卡系统后，在 index.html 中修改购买按钮链接。');
});

// === 背景粒子效果 ===
(function(){
  var canvas=document.getElementById('bgCanvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var w,h,particles;

  function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
  }
  resize();
  window.addEventListener('resize',resize);

  // 创建粒子
  particles=[];
  var count=Math.min(40,Math.floor(w*h/20000));
  for(var i=0;i<count;i++){
    particles.push({
      x:Math.random()*w,
      y:Math.random()*h,
      r:Math.random()*1.5+0.3,
      vx:(Math.random()-0.5)*0.15,
      vy:(Math.random()-0.5)*0.15,
      opacity:Math.random()*0.3+0.05,
      color:Math.random()>0.5?'245,158,11':'230,57,70'
    });
  }

  function animate(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.x<0)p.x=w;
      if(p.x>w)p.x=0;
      if(p.y<0)p.y=h;
      if(p.y>h)p.y=0;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+p.color+','+p.opacity+')';
      ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
